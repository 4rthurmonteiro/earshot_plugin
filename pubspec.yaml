name: earshot_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/earshot_capture/earshot_capture
  - packages/earshot_capture/earshot_capture_platform_interface
  - packages/earshot_capture/earshot_capture_android
  - packages/earshot_capture/earshot_capture_darwin
  - packages/earshot_level
  - packages/earshot_classifier/earshot_classifier
  - packages/earshot_classifier/earshot_classifier_platform_interface
  - packages/earshot_classifier/earshot_classifier_darwin
  - packages/earshot_plugin
  - examples/earshot_example

dev_dependencies:
  melos: ^8.10.0
  very_good_analysis: ^11.0.0

melos:
  repository: https://github.com/4rthurmonteiro/earshot_plugin

  scripts:
    analyze:
      description: Run flutter analyze with --fatal-infos in every package.
      exec: flutter analyze --fatal-infos .

    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --set-exit-if-changed .

    test:
      description: Run tests with 100% coverage in every package that has tests.
      exec:
        # very_good shares a mason cache that races when packages run in parallel.
        concurrency: 1
        command: very_good test --coverage --min-coverage 100 --exclude-coverage "**/*.g.dart" --test-randomize-ordering-seed random
      packageFilters:
        dirExists: test

    release:check:
      description: Validate every package that is not yet on pub.dev with pub publish --dry-run, in dependency order.
      run: melos publish --dry-run --yes

    release:
      description: Publish every package that is not yet on pub.dev without asking, in dependency order, then tag each one <package>-v<version> and push the tags. Run release:check first, from a clean, up-to-date main.
      run: |
        [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ] || { echo "Release from main."; exit 1; }
        [ -z "$(git status --porcelain)" ] || { echo "The working tree is not clean."; exit 1; }
        git fetch -q origin main
        [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "main is not in sync with origin/main."; exit 1; }
        melos publish --no-dry-run --git-tag-version --yes
        git push origin --tags

    pigeon:
      description: Regenerate Pigeon code in every package that owns pigeons/.
      exec: dart run pigeon --input pigeons/messages.dart && dart format lib/src/messages.g.dart
      packageFilters:
        dirExists: pigeons
