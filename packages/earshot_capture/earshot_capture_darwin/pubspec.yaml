name: earshot_capture_darwin
description: "The iOS and macOS implementation of earshot_capture, for on-device microphone capture and permission status."
version: 1.0.0
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_capture/earshot_capture_darwin
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, microphone]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  plugin:
    implements: earshot_capture
    platforms:
      ios:
        pluginClass: EarshotCaptureDarwinPlugin
        dartPluginClass: EarshotCaptureDarwin
        sharedDarwinSource: true
      macos:
        pluginClass: EarshotCaptureDarwinPlugin
        dartPluginClass: EarshotCaptureDarwin
        sharedDarwinSource: true

dependencies:
  earshot_capture_platform_interface: ^1.0.0
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated lib/src/messages.g.dart.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.1.0
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
