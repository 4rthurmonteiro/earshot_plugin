name: earshot_capture_android
description: "Pre-release: the Android implementation of earshot_capture, for on-device microphone capture and permission status."
version: 0.0.1
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_capture/earshot_capture_android
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, microphone]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  plugin:
    implements: earshot_capture
    platforms:
      android:
        package: dev.earshot.capture
        pluginClass: EarshotCaptureAndroidPlugin
        dartPluginClass: EarshotCaptureAndroid

dependencies:
  earshot_capture_platform_interface: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.1.0
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
