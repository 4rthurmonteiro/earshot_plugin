name: earshot_capture
description: "Pre-release: on-device microphone capture for Flutter as a float32 PCM stream, with permission status. No network."
version: 0.1.0
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_capture/earshot_capture
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, microphone, pcm]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  plugin:
    platforms:
      android:
        default_package: earshot_capture_android
      ios:
        default_package: earshot_capture_darwin
      macos:
        default_package: earshot_capture_darwin

dependencies:
  earshot_capture_android: ^0.1.0
  earshot_capture_darwin: ^0.1.0
  earshot_capture_platform_interface: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
