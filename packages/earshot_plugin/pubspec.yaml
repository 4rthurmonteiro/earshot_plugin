name: earshot_plugin
description: "On-device ambient listening for Flutter. Sound level in dB(A) and sound classification in one stream. No network."
version: 0.2.0
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_plugin
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, decibel, sound-classification, microphone]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  earshot_capture: ^0.2.0
  earshot_classifier: ^0.2.0
  earshot_level: ^0.1.0
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
