name: earshot_classifier
description: "Pre-release: on-device sound classification for Flutter, with Apple SoundAnalysis and YAMNet backends. No network."
version: 0.0.1
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_classifier/earshot_classifier
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, sound-classification, machine-learning, yamnet]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: EarshotClassifierYamnet
        dartFileName: src/earshot_classifier_yamnet.dart
      ios:
        default_package: earshot_classifier_darwin
      macos:
        default_package: earshot_classifier_darwin

dependencies:
  earshot_classifier_darwin: ^0.0.1
  earshot_classifier_platform_interface: ^0.0.1
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
