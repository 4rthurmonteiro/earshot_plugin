name: earshot_classifier_darwin
description: "Pre-release: the iOS and macOS implementation of earshot_classifier, backed by Apple's on-device SoundAnalysis."
version: 0.0.1
repository: https://github.com/4rthurmonteiro/earshot_plugin/tree/main/packages/earshot_classifier/earshot_classifier_darwin
issue_tracker: https://github.com/4rthurmonteiro/earshot_plugin/issues
topics: [audio, sound-classification]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

flutter:
  plugin:
    implements: earshot_classifier
    platforms:
      ios:
        pluginClass: EarshotClassifierDarwinPlugin
        dartPluginClass: EarshotClassifierDarwin
        sharedDarwinSource: true
      macos:
        pluginClass: EarshotClassifierDarwinPlugin
        dartPluginClass: EarshotClassifierDarwin
        sharedDarwinSource: true

dependencies:
  earshot_capture_platform_interface: ^0.0.1
  earshot_classifier_platform_interface: ^0.0.1
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated lib/src/messages.g.dart.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.1.0
  very_good_analysis: ^11.0.0
